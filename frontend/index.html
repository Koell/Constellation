<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        opacity: 0.8;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-height: calc(100vh - 60px);
        overflow-y: auto;
        background: rgba(10, 12, 20, 0.85);
        border: 1px solid #2a2e3c;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        min-width: 180px;
      }
      #panel h1 {
        font-size: 14px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      .body-tree summary {
        cursor: pointer;
        padding: 1px 0;
      }
      .body-tree-children {
        margin-left: 16px;
      }
      .body-tree-leaf {
        padding: 1px 0 1px 13px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"><h1>Constellation</h1><div id="panel-body">loading catalog…</div></div>
    <div id="status">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
